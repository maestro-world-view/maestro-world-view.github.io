<script>
    function showItems(val) {
        $('.usernameitems').hide();
        $('.emailitems').hide();
        $('.nav-tabs li').removeClass('active');
        $('.nav-tabs li[data-id="' + val + '"]').addClass('active');
        if (val == 0) {
            $('.usernameitems').show();
        } else if (val == 1) {
            $('.emailitems').show();
        }
    }

    showItems(0);

    $('.nav-tabs li').bind('click', function () {
        var id = $(this).attr('data-id');
        showItems(id);
    })

    function check_username() {
        var val = $.trim($('input[name="username"]').val());
        $('.username_error').text('');
        if (val.length == 0) {
            $('.username_error').text('This field is required')
            return false;
        }
        return true;
    }

    $('input[name="username"]').bind('blur', function () {
        check_username()
    });
    $('input[name="username"]').bind('keyup', function () {
        check_username()
    });

    function check_code() {
        var val = $.trim($('.forget_code').val());
        $('.forget_code_error').text('');
        if (val.length == 0) {
            $('.forget_code_error').text('Please enter security code');
            return false;
        }
        return true;
    }


    $(document).on('keyup', '.forget_code', function () {
        check_code();
    });
    $(document).on('blur', '.forget_code', function () {
        check_code();
    });

    function check_password() {
        var val = $.trim($('input[name="pw"]').val());
        $('.usererrormsg').text('');
        if (val.length == 0) {
            $('.usererrormsg').text('This field is required')
            return false;
        }
        return true;
    }

    $('input[name="pw"]').bind('blur', function () {
        check_password()
    });
    $('input[name="pw"]').bind('keyup', function () {
        check_password()
    });

    function check_email() {
        var val = $.trim($('input[name="email"]').val());
        $('.forget_mail_error').text('');
        if (val.length == 0) {
            $('.forget_mail_error').text('This field is required')
            return false;
        }
        if (!REG.email.test(val)) {
            $('.forget_mail_error').text('This field is required')
            return false;
        }
        return true;
    }

    $(document).on('keyup', 'input[name="email"]', function () {
        check_email();
    });
    $(document).on('blur', 'input[name="email"]', function () {
        check_email();
    });
    var timer_update_email = null;

    $('.send_email_btn').bind('click', function () {
        if (!check_email()) {
            return;
        }
        jPost('/api/v1/user/sendLoginEmail', {
            email: $.trim($('input[name="email"]').val()),
        }, function (res) {
            console.log("rrr", res)
            if (res.code == 200) {
                var lock = 180;
                $('.send_email_btn').text('180s');
                $('.send_email_btn').prop('disabled', true);
                timer_update_email = setInterval(function () {
                    $('.send_email_btn').text((lock--) + 's');
                    if (lock <= 0) {
                        clearInterval(timer_update_email);
                        $('.send_email_btn').text('Obtain code');
                        $('.send_email_btn').prop('disabled', false);
                    }
                }, 1000)
            } else if (res.reason == 'USER_IS_DENY_SITE') {
                $('#lockModal').modal('show');
            } else if (res.data == 'USER_NOT_FOUND') {
                $('.forget_mail_error').text("The email address you provided does not match any accounts on record. Please create a new account.");
            }

        }, function () {
            clearInterval(timer_update_email);
            $('.send_email_btn').text('Obtain code');
            $('.send_email_btn').prop('disabled', false);
        })

    })

    function onLoginSuccess(token) {
        $.get('/utils/loginByToken?user=1&token=' + token + '&rememberme=' + $('input[name="rememberme"]:checked').length, function (res) {
            if (res == 'success') {
                location.reload();
            }
        });
    };

    function loginhandler() {

        var type = $('.nav-tabs li.active').index();
        var postData = {
            username: $.trim($('input[name="username"]').val()),
            password: $.trim($('input[name="pw"]').val()),
            loginType: "username"
        }
        if (type == 1) {
            postData = {
                email: $.trim($('input[name="email"]').val()),
                code: $.trim($('.forget_code').val()),
                loginType: "emailCode"
            }
            if ((check_email() * check_code()) == 0) {
                return;
            }
        } else {
            if ((check_username() * check_password()) == 0) {
                return;
            }
        }
        jPost('/api/v1/user/login', postData, function (res) {
            if (res.code == 200) {
                onLoginSuccess(res.data.token)
            } else if (res.reason == 'USER_IS_DENY_SITE') {
                $('#lockModal').modal('show')
            } else if (res.reason == 'LOGIN_VERIFY_BAD') {
                $('.usererrormsg').text('Sorry, incorrect password.  Please try again.')
            } else if (res.data == 'CODE_ERROR') {
                $('.forget_code_error').html('Code error, please re-try.')
            } else if (res.data == 'USER_NOT_FOUND') {
                if (type == 0) {
                    if (postData['username'].indexOf('@') != -1) {
                        $('.username_error').text("The email address you provided does not match any accounts on record. Please create a new account.");
                    } else {
                        $('.username_error').text('The username you provided does not match any accounts on record. Please create a new account.')
                    }
                } else {
                    $('.forget_mail_error').text("The email address you provided does not match any accounts on record. Please create a new account.");
                }
            }
        })

        // $.ajax({
        //     type: "POST",
        //     url: "/site/ajax_login",
        //     data: {
        //         'username': $.trim($('input[name="username"]').val()),
        //         'pw': $.trim($('input[name="pw"]').val()),
        //         'rememberme': $('input[name="rememberme"]:checked').length
        //     },
        //     success: function (re) {
        //         re = parseInt(re);
        //         switch (re) {
        //             //个人用户已登录
        //             case 0:
        //                 location.reload();
        //                 break;
        //             //禁整站
        //             case 2:
        //                 $('.usererrormsg').text("Your account has been blocked due to posts containing spam, advertising or inappropriate content.")
        //                 break;
        //             //登录成功
        //             case 6:
        //                 location.reload();
        //                 break;
        //             default:
        //                 $('.usererrormsg').text('Sorry, invalid username or password. Please try again.')
        //         }
        //     }
        // });
    }

    $('.perBtn').bind('tap', loginhandler);
</script>
