<!doctype html><html><head><meta charset="utf-8"><title>Maestro Email Directory</title>
<style>body{font-family:Arial,sans-serif;margin:24px;background:#f5f5f5}header{position:sticky;top:0;background:#fff;padding:14px;border-radius:12px}input{width:100%;padding:12px;font-size:16px;box-sizing:border-box}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:14px;margin-top:16px}.card{display:flex;gap:14px;background:white;padding:16px;border-radius:12px;box-shadow:0 1px 4px #bbb}.avatar{width:92px;height:92px;object-fit:cover;border-radius:10px}.blank{display:flex;align-items:center;justify-content:center;background:#eee;color:#777;font-size:12px}h2{margin:0 0 6px;font-size:18px}.email{font-weight:bold;margin:7px 0}.links a{margin-right:12px}@media(max-width:600px){.grid{grid-template-columns:1fr}.card{flex-direction:column}}</style><link rel="stylesheet" href="maestro_world_view.css"></head><body><header><h1>Maestro Email Directory</h1><input id="q" placeholder="Search name, email, business, city, profession..."></header><main class="grid" id="g"></main><script>q.oninput=()=>{let x=q.value.toLowerCase();document.querySelectorAll('.card').forEach(c=>c.style.display=c.innerText.toLowerCase().includes(x)?'flex':'none')}</script><script src="maestro_filters.js"></script><script src="maestro_realtime.js"></script></body></html>
